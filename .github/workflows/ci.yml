# ============================================================================
# AEGIS - Continuous Integration
#
# Runs on every push and pull request. The job order is deliberate: the cheap,
# fast checks run first and fail fast, so a formatting error does not wait for
# a five-minute integration suite to tell you about it.
#
#   quality      (~2m)  lint, format check, type check, unit tests
#   security     (~2m)  secret scan, dependency audit, IaC scan
#   terraform    (~1m)  the honeypot's infrastructure, validated
#   integration  (~4m)  the real infrastructure, exercised end to end
#
# EXACT VERSIONS, NOT COMPATIBLE ONES
# Every install passes -c requirements/constraints.txt, the frozen environment
# these tests passed in. Without it CI resolves the newest compatible release
# of 199 packages, and a failure means "something upstream changed today"
# rather than "your commit broke something".
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 3.10 is what the project was built and tested on, and what the constraints
  # file was frozen from. mypy also targets it.
  PYTHON_VERSION: "3.10"
  COMPOSE: docker compose --env-file .env -f infra/docker-compose.yml

permissions:
  contents: read          # least privilege: CI only needs to read the code

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Every extra, because the tests cover every layer: dagster asset
          # definitions, dbt models, the ML models and the export.
          pip install -c requirements/constraints.txt -e ".[dev,ml,quality,orchestration]"

      - name: Lint (ruff)
        run: ruff check src tests scripts --output-format=github

      - name: Format check (ruff)
        run: ruff format --check src tests scripts

      - name: Type check (mypy)
        run: mypy src

      - name: Unit tests
        run: pytest tests -v --cov=aegis --cov-report=term-missing -m "not integration"

  extras:
    name: Extras declare what they need
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `quality` job installs every extra, so it cannot notice that one of
    # them under-declares its dependencies. This job installs ONLY [ml] and
    # exercises it. It exists because `ml` forgot alembic: MLflow's SQLite
    # store needs it, the laptop had it via Dagster, and the gap surfaced
    # halfway through a deployment instead of here.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install only the ml extra
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints.txt -e ".[ml]" "pytest~=9.1"

      - name: Models, tracking and publishing in that environment
        run: |
          pytest -q tests/test_ml.py tests/test_tracking.py tests/test_sessions.py \
                    tests/test_publish.py tests/test_governance.py

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # gitleaks needs full history to scan every commit

      # Secrets committed at ANY point in history, not just in the diff.
      # v3 runs on Node 24; v2 stopped working when GitHub removed Node 20.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Known CVEs in our own dependency tree. A data platform's largest attack
      # surface is usually the hundreds of transitive packages it installed.
      # Auditing the constraints file, not an installed environment: it is the
      # exact set CI and the daily pipeline install, and it needs no install
      # step. Auditing the environment also failed on AEGIS itself - --strict
      # treats "aegis 0.1.0 is not on PyPI" as an error, which is true and
      # irrelevant, since it is this repository.
      #
      # PYSEC-2026-113 (pyarrow 18.1.0) is excepted, with reasons, rather than
      # silenced: it is a use-after-free in Arrow C++ when reading an IPC FILE
      # with pre-buffering enabled, and the advisory states the functionality
      # "is not exposed in language bindings (Python, Ruby, C GLib), so these
      # bindings are not vulnerable". AEGIS reads Parquet through PyIceberg and
      # never calls PreBufferMetadata. The fix is pyarrow 23, a major upgrade
      # that PyIceberg 0.12 would have to be re-verified against; that belongs
      # in a deliberate dependency bump, not in a deploy.
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --strict --desc -r requirements/constraints.txt \
            --ignore-vuln PYSEC-2026-113

      # Insecure infrastructure configuration, caught before it is deployed.
      #
      # soft_fail stays on for one honest reason: the honeypot DELIBERATELY
      # exposes SSH and Telnet to the whole internet, which Checkov flags as a
      # critical misconfiguration - correctly, for any other machine. The
      # findings are read, not enforced; docs/adr/0009 records the controls
      # that make that exposure safe.
      - name: IaC scan (Checkov)
        uses: bridgecrewio/checkov-action@v12.3123.0
        with:
          directory: infra/
          framework: dockerfile,docker_compose,terraform
          soft_fail: true
          output_format: cli

  terraform:
    name: Terraform (honeypot)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.2"

      - name: Format check
        run: terraform fmt -check -recursive infra/honeypot/terraform

      # -backend=false: validate the configuration without any cloud credentials.
      - name: Validate
        working-directory: infra/honeypot/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  integration:
    name: Integration (real infrastructure)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints.txt -e ".[dev,ml,quality]"

      - name: Start infrastructure
        run: |
          cp .env.example .env
          # --wait on the long-running services only: minio-init is a one-shot
          # job that exits once the buckets exist, which --wait reports as a
          # failed container.
          $COMPOSE up -d --wait redpanda minio postgres
          $COMPOSE up --no-deps --exit-code-from minio-init minio-init

      - name: Environment diagnostics
        run: python scripts/doctor.py

      - name: Integration tests
        run: pytest tests -v -m integration

      - name: Dump container logs on failure
        if: failure()
        run: $COMPOSE logs --tail=200

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
