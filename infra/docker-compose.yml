# ============================================================================
# AEGIS - Local infrastructure (Phase 0)
#
# DESIGN RULE: this file runs INFRASTRUCTURE ONLY.
# Application code (producers, consumers, dbt, Dagster, FastAPI) runs on the
# HOST in a Python venv. Rationale: this laptop gives Docker ~3.9 GB total;
# containerising the app layer would waste ~1.5 GB on duplicated Python
# runtimes and slow the edit->run loop to a rebuild. See docs/adr/0002.
#
# Memory budget (hard ceiling ~1.8 GB so the host stays usable):
#   redpanda 1024M | console 128M | minio 384M | postgres 256M
# ============================================================================

name: aegis

services:
  # --------------------------------------------------------------------------
  # Redpanda: Kafka-API-compatible broker, single binary, no ZooKeeper.
  # Chosen over Apache Kafka purely for memory (see docs/adr/0003).
  # Your code speaks the Kafka protocol, so this is a swap-in for MSK/Confluent.
  # --------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    container_name: aegis-redpanda
    command:
      - redpanda
      - start
      - --smp=1                      # 1 CPU core (default grabs all of them)
      - --memory=900M                # seastar arena; NOT the container limit
      - --reserve-memory=0M          # do not reserve extra for the OS page cache
      - --overprovisioned            # disable real-time scheduling tuning
      - --node-id=0
      - --check=false
      # Two listeners: 'internal' for container-to-container, 'external' for
      # your host venv. One listener cannot advertise both hostnames.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"   # Kafka bootstrap (from host)
      - "18081:18081"   # Schema Registry (from host)
      - "18082:18082"   # HTTP proxy (handy for curl-ing a topic)
      - "19644:9644"    # Admin API / Prometheus metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # --------------------------------------------------------------------------
  # Redpanda Console: web UI for topics, messages, consumer groups, schemas.
  # Your debugging window into the streaming layer for the whole project.
  # --------------------------------------------------------------------------
  console:
    image: docker.redpanda.com/redpandadata/console:v2.8.2
    container_name: aegis-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "8080:8080"
    mem_limit: 160m

  # --------------------------------------------------------------------------
  # MinIO: S3-compatible object storage = the physical layer of the lakehouse.
  # Everything we write here (Parquet + Iceberg metadata) uses the real S3 API,
  # so Phase 9 moves to AWS S3 by changing one endpoint URL. That portability
  # is the whole point of building on object storage instead of a local disk.
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: aegis-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AEGIS_S3_ACCESS_KEY:-aegis_dev_access}
      MINIO_ROOT_PASSWORD: ${AEGIS_S3_SECRET_KEY:-aegis_dev_secret_change_me}
      MINIO_REGION: ${AEGIS_S3_REGION:-eu-west-3}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  # --------------------------------------------------------------------------
  # One-shot job: create buckets, then exit.
  # Declaring buckets in code (not by clicking a UI) is the same discipline as
  # Terraform: the environment must be reproducible from an empty machine.
  # --------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: aegis-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_aegis: http://${AEGIS_S3_ACCESS_KEY:-aegis_dev_access}:${AEGIS_S3_SECRET_KEY:-aegis_dev_secret_change_me}@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc mb --ignore-existing aegis/aegis-lakehouse
        mc mb --ignore-existing aegis/aegis-raw
        mc mb --ignore-existing aegis/aegis-quarantine
        mc mb --ignore-existing aegis/aegis-mlflow
        mc version enable aegis/aegis-lakehouse
        echo "[minio-init] buckets ready:"
        mc ls aegis/
    mem_limit: 64m

  # --------------------------------------------------------------------------
  # Postgres: metadata store. Serves THREE roles across the project:
  #   1. Iceberg catalog (which table version is current) - Phase 3
  #   2. Dagster run/event storage                        - Phase 5
  #   3. Serving store for the dashboard's hot queries    - Phase 7
  # Keeping them in one instance is a laptop compromise; in cloud they split.
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: ${AEGIS_PG_USER:-aegis}
      POSTGRES_PASSWORD: ${AEGIS_PG_PASSWORD:-aegis_dev_password_change_me}
      POSTGRES_DB: ${AEGIS_PG_DATABASE:-aegis}
      # We keep password auth even locally so the code path matches production.
      # Security posture starts on day one, not in Phase 8.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "15432:5432"   # 15432 avoids clashing with any local Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AEGIS_PG_USER:-aegis} -d ${AEGIS_PG_DATABASE:-aegis}"]
      interval: 10s
      timeout: 5s
      retries: 10

# ----------------------------------------------------------------------------
# NAMED VOLUMES, not Windows bind mounts.
# Why: Postgres' initdb and Redpanda both require POSIX ownership on their data
# directory. A Windows bind mount cannot express that, and initdb aborts with
# "data directory has invalid permissions". Named volumes live inside the WSL2
# virtual disk with a real Linux filesystem - which also keeps this data out of
# your OneDrive sync. Inspect them with:  docker volume ls | grep aegis
# ----------------------------------------------------------------------------
volumes:
  redpanda-data:
  minio-data:
  postgres-data:

networks:
  default:
    name: aegis-net
